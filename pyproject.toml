[project]
name = "vnpy"
dynamic = ["version"]
description = "A framework for developing quant trading systems."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Xiaoyou Chen", email = "xiaoyou.chen@mail.vnpy.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Office/Business :: Financial :: Investment",
    "Natural Language :: Chinese (Simplified)",
    "Typing :: Typed",
]
requires-python = "==3.13.*"
dependencies = [
    "tzlocal>=5.3.1",
    "PySide6>=6.10.0",
    "pyqtgraph>=0.13.7",
    "qdarkstyle>=3.2.3",
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "ta-lib>=0.6.4",
    "deap>=1.4.2",
    "pyzmq>=27.1.0",
    "plotly>=6.4.0",
    "tqdm>=4.67.1",
    "loguru>=0.7.3",
    "nbformat>=5.10.4",
    "requests>=2.32.0",
    "qrcode>=7.4.2"
]
keywords = ["quant", "quantitative", "investment", "trading", "algotrading"]

[project.optional-dependencies]
alpha = [
    "polars>=1.26.0",
    "scipy>=1.16.3",
    "alphalens-reloaded>=0.4.5",
    "scikit-learn>=1.7.2",
    "lightgbm>=4.6.0",
    "torch>=2.6.0",
    "pyarrow>=21.0.0,<22",  # Constrained for workspace compatibility
]
dev-legacy = [
    "pandas-stubs>=2.2.3.250308",
    "hatchling>=1.27.0",
    "babel>=2.17.0",
    "pytest>=9.0.1",
    "black>=25.11.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.2.3.250308",
    "scipy-stubs>=1.16.3.0",
    "hatchling>=1.27.0",
    "babel>=2.17.0",
    "pytest>=9.0",
    "black>=25.11.0",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
"Homepage" = "https://www.vnpy.com"
"Documentation" = "https://www.vnpy.com/docs"
"Changes" = "https://github.com/vnpy/vnpy/blob/master/CHANGELOG.md"
"Source" = "https://github.com/vnpy/vnpy/"
"Forum" = "https://www.vnpy.com/forum"

[build-system]
requires = ["hatchling>=1.27.0", "babel>=2.17.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/vnpy/__init__.py"
pattern = "__version__ = ['\"](?P<version>[^'\"]+)['\"]"

[tool.hatch.build.targets.wheel]
packages = ["src/vnpy"]
include-package-data = true

[tool.hatch.build.targets.sdist]
include = ["src/vnpy*"]

[tool.hatch.build.hooks.custom]
path = "src/vnpy/trader/locale/build_hook.py"

[tool.hatch.build.targets.wheel.force-include]
"src/vnpy/trader/locale/en/LC_MESSAGES/vnpy.mo" = "vnpy/trader/locale/en/LC_MESSAGES/vnpy.mo"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
output-format = "full"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "polars",
    "lightgbm",
    "hatchling.*",
    "qrcode"
]
ignore_missing_imports = true